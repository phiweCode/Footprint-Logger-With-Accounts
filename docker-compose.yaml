services:
  # Express Backend
  - type: web
    name: footprint-api
    env: docker
    dockerfilePath: ./backend/Dockerfile
    plan: free
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: MONGO_URI
        sync: false 
      - key: JWT_ACCESS_SECRET
        sync: false     
      - key: JWT_REFRESH_SECRET
        sync: false  

  # React Frontend (Vite)
  - type: web
    name: footprint-frontend
    env: static
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_BACKEND_URL
        sync: false 
      - key: NODE_ENV
        value: production

